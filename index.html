<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Bieli</title>
<meta name="description" content="Interaktywna mapa do powieści „Biel” Szymona Urbanowskiego: Wrocław i Śląsk 1293–1294, scena po scenie, bez zdradzania dalszych rozdziałów.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23a3281e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27serif%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%23fffaf5%27%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&amp;family=Uncial+Antiqua&amp;display=swap">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand">
      <h1>Biel</h1>
      <p>atlas do powieści <em>Szymona Urbanowskiego</em></p>
    </div>
    <nav class="sheets" id="sheets" aria-label="Arkusze mapy">
      <button type="button" data-sheet="slask" aria-pressed="false">Śląsk</button>
      <button type="button" data-sheet="wroclaw" aria-pressed="false">Wrocław</button>
      <button type="button" data-sheet="ostrow" aria-pressed="false">Ostrów Tumski</button>
      <button type="button" data-sheet="opactwo" aria-pressed="false">Opactwo na Piasku</button>
    </nav>
    <div class="progress">
      <label for="progress">Przeczytane do</label>
      <select id="progress"></select>
    </div>
  </header>

  <main class="stage">
    <div id="map" aria-label="Mapa Śląska, Wrocławia i Ostrowa Tumskiego"></div>
    <div id="abbey" hidden aria-label="Plan opactwa Najświętszej Marii na Piasku"></div>
    <div class="stage-caption" id="caption" aria-live="polite"></div>
    <div class="peek" id="peek" hidden></div>
    <div class="welcome" id="welcome" hidden>
      <button type="button" class="close" id="welcome-close" aria-label="Zamknij">×</button>
      <h2>Mapa bez spoilerów</h2>
      <p>Mapa pokazuje sceny tylko do rozdziału, który już przeczytano. Dalsze rozdziały zostają zabielone. Ustawienie można zmienić w każdej chwili u góry strony.</p>
      <div class="pick" id="welcome-pick"></div>
    </div>
  </main>

  <section class="time" aria-label="Oś czasu powieści">
    <div class="when" id="when"></div>
    <div class="ctl">
      <button type="button" class="icon-btn" id="prev" aria-label="Poprzednia scena" title="Poprzednia scena (←)">‹</button>
      <button type="button" class="icon-btn" id="next" aria-label="Następna scena" title="Następna scena (→)">›</button>
    </div>
    <div class="strip-scroll"><div class="strip" id="strip"></div></div>
  </section>

  <aside class="panel" aria-label="Karta">
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="card" aria-selected="true">Karta</button>
      <button type="button" role="tab" data-tab="scenes" aria-selected="false">Sceny</button>
      <button type="button" role="tab" data-tab="places" aria-selected="false">Miejsca</button>
      <button type="button" role="tab" data-tab="people" aria-selected="false">Postacie</button>
      <button type="button" role="tab" data-tab="about" aria-selected="false">O mapie</button>
    </div>
    <div class="panel-body" id="panel" role="tabpanel"></div>
  </aside>
</div>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="data/biel-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
